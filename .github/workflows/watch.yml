name: Live watch (chat + audio bursts)

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min: notice when a streamer goes live (GitHub skips many of these)
  workflow_dispatch:
    inputs:
      streamer:
        description: "Only this streamer (empty = all)"
        default: ""
      dry_run:
        description: "Do not upload, keep the Shorts as an artifact"
        type: boolean
        default: false
      hours:
        description: "Watch for at most this many hours"
        default: "5.6"

permissions:
  contents: read
  actions: write            # to start the next shift of a long stream

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      streamers: ${{ steps.s.outputs.streamers }}
    steps:
      - uses: actions/checkout@v7
      - id: s
        run: |
          if [ -n "${{ inputs.streamer }}" ]; then echo 'streamers=["${{ inputs.streamer }}"]' >> "$GITHUB_OUTPUT"
          else echo "streamers=$(python3 -c 'import yaml,json;print(json.dumps(yaml.safe_load(open("config.yaml"))["streamers"]))')" >> "$GITHUB_OUTPUT"; fi

  watch:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        streamer: ${{ fromJson(needs.list.outputs.streamers) }}
    concurrency:              # one watcher per streamer
      group: watch-${{ matrix.streamer }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Live?
        id: live
        run: |
          # Kick sometimes answers with an error page: retry, and count a bad answer as "not live" instead of failing
          code=0
          for i in 1 2 3; do
            body=$(curl -s --max-time 20 -A "Mozilla/5.0" -H "Accept: application/json" \
              "https://kick.com/api/v2/channels/${{ matrix.streamer }}" || true)
            code=$(printf '%s' "$body" | python3 -c 'import sys,json
          try:
              d = json.load(sys.stdin); print(1 if (d.get("livestream") or {}).get("is_live") else 0)
          except Exception:
              print("x")')
            [ "$code" != "x" ] && break
            sleep 10
          done
          [ "$code" = "x" ] && { echo "Kick did not answer properly, treating as offline"; code=0; }
          echo "live=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        if: steps.live.outputs.live == '1'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        if: steps.live.outputs.live == '1'
        timeout-minutes: 15
        run: |
          # apt sometimes hangs on a slow mirror: time limits and one retry
          for i in 1 2; do
            sudo timeout 180 apt-get update -qq -o Acquire::Retries=3               && sudo timeout 240 apt-get install -y -qq --no-install-recommends ffmpeg && break
            sleep 5
          done
          pip install -r requirements.txt

      - name: Whisper model cache
        if: steps.live.outputs.live == '1'
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Secrets
        if: steps.live.outputs.live == '1'
        env:
          YT_TOKEN_CLIPS: ${{ secrets.YT_TOKEN_CLIPS }}
        run: |
          mkdir -p credentials
          printf '%s' "$YT_TOKEN_CLIPS" > credentials/token_clips.json

      - name: Watch and clip
        if: steps.live.outputs.live == '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m clipper.watch "${{ matrix.streamer }}" --hours "${{ inputs.hours || '5.6' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Keep test Shorts
        if: always() && inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: shorts-${{ matrix.streamer }}-${{ github.run_id }}
          path: out/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Next shift if the stream is still on
        if: always() && steps.live.outputs.live == '1' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat still_live 2>/dev/null)" = "1" ]; then
            gh workflow run watch.yml -f streamer="${{ matrix.streamer }}"
          fi
