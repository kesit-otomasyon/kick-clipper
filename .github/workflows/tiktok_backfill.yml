name: TikTok backfill

on:
  push:
    branches: [main]
    paths: [tiktok_backfill.yaml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiktok-backfill
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        timeout-minutes: 15
        run: |
          # apt sometimes hangs on a slow mirror: time limits and one retry
          for i in 1 2; do
            sudo timeout 180 apt-get update -qq -o Acquire::Retries=3               && sudo timeout 240 apt-get install -y -qq --no-install-recommends ffmpeg && break
            sleep 5
          done
          pip install -r requirements.txt

      - name: Whisper model cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Secrets
        env:
          YT_TOKEN_CLIPS: ${{ secrets.YT_TOKEN_CLIPS }}
        run: |
          mkdir -p credentials
          printf '%s' "$YT_TOKEN_CLIPS" > credentials/token_clips.json

      - name: Send to TikTok
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_TOKEN_KEY: ${{ secrets.TIKTOK_TOKEN_KEY }}
          GH_VARS_PAT: ${{ secrets.GH_VARS_PAT }}
        run: python -m clipper.redo --requests tiktok_backfill.yaml --tiktok-only
