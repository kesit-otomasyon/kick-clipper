name: Live clips

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 min
  workflow_dispatch:
    inputs:
      streamer:
        description: "Only this streamer (empty = all)"
        default: ""
      dry_run:
        description: "Do not upload, keep the Shorts as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: viewer-clips
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install -r requirements.txt

      - name: Whisper model cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Secrets
        env:
          YT_TOKEN_CLIPS: ${{ secrets.YT_TOKEN_CLIPS }}
        run: |
          mkdir -p credentials
          printf '%s' "$YT_TOKEN_CLIPS" > credentials/token_clips.json

      - name: Viewer clips -> Shorts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m clipper.viewer_clips ${{ inputs.streamer && format('--streamer {0}', inputs.streamer) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Keep test Shorts
        if: always() && inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: shorts-${{ github.run_id }}
          path: out/*
          if-no-files-found: ignore
          retention-days: 7
