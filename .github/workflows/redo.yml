name: Redo Shorts

on:
  schedule:
    - cron: "30 8 * * *"   # once a day after the YouTube quota resets (a request that failed is tried again)
  push:
    branches: [main]
    paths: [redo.yaml]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not upload or delete, keep the Short as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: redo
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        timeout-minutes: 15
        run: |
          # apt sometimes hangs on a slow mirror: time limits and one retry
          for i in 1 2; do
            sudo timeout 180 apt-get update -qq -o Acquire::Retries=3               && sudo timeout 240 apt-get install -y -qq --no-install-recommends ffmpeg && break
            sleep 5
          done
          command -v ffmpeg >/dev/null || { echo "ffmpeg kurulamadı (apt)"; exit 1; }
          pip install -r requirements.txt

      - name: Whisper model cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Secrets
        env:
          YT_TOKEN_CLIPS: ${{ secrets.YT_TOKEN_CLIPS }}
        run: |
          mkdir -p credentials
          printf '%s' "$YT_TOKEN_CLIPS" > credentials/token_clips.json

      - name: Redo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m clipper.redo ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Keep test Shorts
        if: always() && inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: shorts-${{ github.run_id }}
          path: out/*
          if-no-files-found: ignore
          retention-days: 7
