# Kick canlı yayın kesit sistemi - ayarlar

streamers:            # kick.com/<ad>  (izin aldığın yayıncılar)
  - eray
  - rraenee

cams:                  # başlangıç kamera kutusu [x, y, genişlik, yükseklik]; izleme 30 dk'da bir kendisi yeniden bulur
  rraenee: [0.725, 0.13, 0.275, 0.28]   # sağ üst, grup kamerası (yüzler küçük, otomatik bulunamıyor)
  eray: [0.763, 0.092, 0.237, 0.237]       # sağ üst, grup kamerası

tiktok:                         # aynı kesit TikTok'a da gider (@efsaneyayinanlari)
  enabled: true
  draft: true                   # uygulama onaylanana kadar: TikTok gelen kutusuna taslak, paylaşmak tek dokunuş
  public: false                 # onaydan sonra draft: false + public: true -> doğrudan herkese açık

youtube_channel: clips          # credentials/token_clips.json (GitHub secret YT_TOKEN_CLIPS)

clips:
  per_streamer_per_day: 45      # yakalanan her iyi an yüklenir; yükleme kotası günde 100 çağrı (tanesi 1 birim)
  per_day_total: 90             # 100'ün altında: yeniden yapım için pay; YouTube kanal sınırına gelirse o gün durur
  cooldown_s: 150               # iki aday an arasında en az bu kadar saniye
  cam_every_min: 30             # kamera kutusu bu sıklıkta yeniden aranır (yayıncı düzeni değiştirirse)
  pick_every_min: 2             # kısa pencere: eşiği geçen neredeyse her an yüklenir
  min_quality: 12               # sadece iyi anlar: kalite = güç x görüntü puanı (18 Kasım: 45 adaydan ~15'i geçerdi)
  viewer_clip_boost: 1.5        # izleyicilerin Kick'te kesit aldığı anın kalitesi bu kadar artar
  hold_weak_min: 6              # eşiğin altındaki an bu kadar dakika bekler (izleyiciler kesit alırsa geçebilir)
  before_s: 30                  # patlamadan önceki kısım (olayın başı)
  after_s: 15                   # patlamadan sonraki kısım (tepki)
  burst_db: 9.0                 # sesin, son 2 dakikanın ortancasından bu kadar dB yükselmesi = patlama
  # sohbet patlaması (ana sinyal): son 10 sn, son 5 dakikanın ortancasıyla karşılaştırılır
  chat_window_s: 10
  chat_ratio: 3.0               # skor (mesaj hızı x gülme/şaşırma oranı) tabanın bu kadar katı
  chat_min_hype_users: 4        # en az bu kadar farklı kişi gülüyor/şaşırıyor (tek kişinin spamı sayılmaz)
  chat_min_hype: 0.35           # yazanların en az bu oranı gülüyor/şaşırıyor
  chat_clip_users: 3            # 20 sn içinde bu kadar farklı kişi "kesit/clip" yazarsa direkt patlama
  chat_delay_s: 12              # izleyiciler olaydan bu kadar sonra yazıyor; an bu kadar geriye alınır
  # görüntü kontrolü: kesit ancak yayının görüntüsü de iyiyse yapılır
  max_black: 0.3                # karelerin en fazla bu oranı siyah olabilir
  max_frozen: 0.7               # karelerin en fazla bu oranı donuk (hareketsiz) olabilir
  min_visual: 7                 # Gemini'nin karelere verdiği puan (1-10); kurulum/ayar ekranı, masaüstü,
                                # "no signal", "birazdan başlıyoruz", reklam, oyun menüsü düşük puan alır
  min_seconds_live: 300         # yayının ilk 5 dakikası (açılış, müzik) atlanır
  publish_delay_min: 15         # yüklemeden bu kadar dakika sonra yayına girer

# Ana yöntem (2026-11-14): izleyicilerin Kick'te aldığı kesitler. Her 15 dakikada yeni olanlar alınır.
viewer_clips:
  per_run: 2                    # bir çalışmada yayıncı başına en fazla bu kadar yeni kesit
  min_views: 15                  # en az bu kadar izlenmiş kesitler (boş/test kesitlerini eler)
  min_seconds: 8
  max_seconds: 60
  after_stream_hours: 3         # yayın bittikten sonra bu kadar saat daha yeni kesitlere bakılır

blocked_categories: [Slots & Casino, Slots, Casino, Gambling, Pools, Hot Tubs & Bikinis]

llm:
  gemini: [gemini-flash-latest, gemini-3.5-flash, gemini-flash-lite-latest]
  groq: openai/gpt-oss-120b
